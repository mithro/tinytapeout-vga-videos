# Derived from the project's own pin names by `tt-vga stimulus`.
# One pin at a time, from the pin names: select ui[0], select ui[1], select ui[2].
# Correct it by hand if the design wants something else.

inputs:
  - at: 0
    ui_in: 0
  - at: 3.0s
    ui_in: 1
  - at: 3.05s
    ui_in: 0
  - at: 6.5s
    ui_in: 2
  - at: 6.55s
    ui_in: 0
  - at: 10.0s
    ui_in: 4
  - at: 10.05s
    ui_in: 0
