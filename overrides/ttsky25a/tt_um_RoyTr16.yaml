# Derived from the project's own pin names by `tt-vga stimulus`.
# One pin at a time, from the pin names: right ui[1], left ui[2], select ui[7].
# Correct it by hand if the design wants something else.

inputs:
  - at: 0
    ui_in: 0
  - at: 3.0s
    ui_in: 2
  - at: 3.4s
    ui_in: 0
  - at: 6.5s
    ui_in: 4
  - at: 6.9s
    ui_in: 0
  - at: 10.0s
    ui_in: 128
  - at: 10.05s
    ui_in: 0
  - at: 13.5s
    ui_in: 2
  - at: 13.9s
    ui_in: 0
  - at: 17.0s
    ui_in: 4
  - at: 17.4s
    ui_in: 0
