# {{CONF_DIR}}/frames.conf -- the VGA frames subtree of the publish directory.
# Source: tinytapeout-vga-videos host/data-upload/frames.conf (rendered by
# render.py).  Read by two scripts:
#
#   data-upload-sync         excludes /FRAMES_SUBTREE/ from the 5-minute upload
#                            (and refuses to run without this file);
#   data-upload-frames-sync  uploads FRAMES_SUBTREE: the projects named in
#                            STAGING_DIR/changed.log, or all of it with --full.
#
# Format: KEY=VALUE lines, no quotes, no spaces; "#" starts a comment line.
# Each key exactly once; no other keys.
#
# FRAMES_SUBTREE  path relative to the publish directory, no leading or
#                 trailing "/": the pipeline's frames_root.
# STAGING_DIR     absolute path of the pipeline's staging directory, which
#                 holds changed.log.  Written by the pipeline user: nothing in
#                 it is trusted.
FRAMES_SUBTREE={{FRAMES_SUBTREE}}
STAGING_DIR={{STAGING_DIR}}
