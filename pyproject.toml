[project]
name = "tinytapeout-vga-videos"
version = "0.1.0"
description = "Simulate Tiny VGA compatible Tiny Tapeout projects on a remote host and record videos of their output"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0",
    "tinytapeout-project-search",
    "xxhash==4.1.0",
]

[project.scripts]
tt-vga = "ttvga.cli:main"

[tool.uv.sources]
tinytapeout-project-search = { git = "https://github.com/mithro/tinytapeout-project-search", rev = "be8587d" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ttvga"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=tmp/pytest -m 'not sim'"
markers = ["sim: needs tt-vga dev-tools (Verilator and vgacap)"]
