# /etc/nginx/snippets/userdir-web.conf  -  `include snippets/userdir-web.conf;` inside the server block
#
# Serve /~user/... from /home/user/public_html/... with a directory listing.
# The home directory itself must be traversable by www-data (chmod o+x) and
# public_html world-readable; nothing else in the home is exposed.
location ~ ^/~([a-z][-a-z0-9_]*)(/.*)?$ {
	alias /home/$1/public_html$2;
	autoindex on;
	autoindex_exact_size off;
	autoindex_localtime on;
	# Big files: hand them to the kernel rather than buffering whole clips.
	sendfile on;
	tcp_nopush on;
	# No `types` block here on purpose. One would replace nginx's own table
	# rather than extend it, and every extension it forgot would be served as
	# application/octet-stream: a browser will not play a video or show an
	# animation it is handed under that type. /etc/nginx/mime.types already
	# names video/mp4, video/webm, image/gif, image/png and application/json,
	# which is everything published here.
	default_type application/octet-stream;
}
