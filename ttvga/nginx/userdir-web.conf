# /etc/nginx/snippets/userdir-web.conf  -  `include snippets/userdir-web.conf;` inside the server block
#
# Serve /~user/... from /home/user/public_html/... with a directory listing.
# The home directory itself must be traversable by www-data (chmod o+x) and
# public_html world-readable; nothing else in the home is exposed.
location ~ ^/~([a-z][-a-z0-9_]*)(/.*)?$ {
	alias /home/$1/public_html$2;
	autoindex on;
	autoindex_exact_size off;
	autoindex_localtime on;
	# Big files: hand them to the kernel rather than buffering whole clips.
	sendfile on;
	tcp_nopush on;
	types {
		text/html html htm;
		text/plain txt md;
		text/css css;
		application/json json;
		image/png png;
		image/jpeg jpg jpeg;
		image/svg+xml svg;
		video/x-msvideo avi;
		video/mp4 mp4;
	}
	default_type application/octet-stream;
}
