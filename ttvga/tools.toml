# Pinned toolchain installed into the ttvga user's home on the simulation host.
# Everything is a plain tarball; nothing is installed system-wide.

[oss-cad-suite]
version = "2026-09-14"
url = "https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-14/oss-cad-suite-linux-x64-20260914.tgz"
dir = "oss-cad-suite"
check = "oss-cad-suite/bin/verilator"

[ffmpeg]
version = "n8.1.2-52-g5a03dfa0f6 (BtbN autobuild-2026-09-14-13-17)"
url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-14-13-17/ffmpeg-n8.1.2-52-g5a03dfa0f6-linux64-gpl-8.1.tar.xz"
dir = "ffmpeg"
strip = 1
check = "ffmpeg/bin/ffmpeg"

[uv]
version = "0.13.8"
url = "https://github.com/astral-sh/uv/releases/download/0.13.8/uv-x86_64-unknown-linux-gnu.tar.gz"
dir = "uv"
strip = 1
check = "uv/uv"

# Every host script runs under this interpreter, installed by `uv python install`.
[python]
version = "3.14.7"

# TEMPORARY pin to the head of the unmerged vgacap PR #62 (fast-frame-hash, XXH3-128 digests).
# Replace it with the vgacap `main` merge commit before this branch merges.
# The last pin on `main` was c7176da (2026-11-27).
[vgacap]
git = "https://github.com/mithro/vgacap"
commit = "80f6aa3fc3c5a7ebace8625bf4ab6d14c69373a2"

# derive.py hashes each PNG record with XXH3-128 (the frames format's digest); the host
# scripts run without a project, so uv installs it for them: `uv run --with xxhash==<version>`.
[xxhash]
version = "4.1.0"
